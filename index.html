<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Örnek web siteleri</title>
<style>
  body { margin: 0; background: #f4f5f2; color: #191c1a; font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(100% - 2.5rem, 60rem); margin: 0 auto; padding: 3rem 0 4rem; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; margin: 0 0 0.75rem; }
  p { margin: 0 0 2rem; color: #545a56; max-width: 36rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
  a { display: block; color: inherit; text-decoration: none; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e0e3df; }
  a:focus-visible { outline: 3px solid #2f5d50; outline-offset: 3px; }
  img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
  span { display: block; padding: 0.8rem 1rem; font-weight: 650; }
</style>
</head>
<body>
<main>
  <h1>İşletmeler için tek sayfalık web sitesi örnekleri</h1>
  <p>Fiyat listesi, menü, çalışma saatleri, harita ve WhatsApp butonu tek sayfada. Örnekler Eyüp Kaan Amanvermez tarafından hazırlanmıştır.</p>
  <ul>
    <li><a href="berber/"><img src="img/berber-1.jpg" alt=""><span>Berber</span></a></li>
    <li><a href="kafe/"><img src="img/kafe-1.jpg" alt=""><span>Kafe</span></a></li>
    <li><a href="pilates/"><img src="img/pilates-1.jpg" alt=""><span>Pilates stüdyosu</span></a></li>
    <li><a href="diyetisyen/"><img src="img/diyetisyen-1.jpg" alt=""><span>Diyetisyen</span></a></li>
  </ul>
</main>
</body>
</html>
